<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { background: #fafafa; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    #canvas-container { width: 340px; height: 340px; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <script>
    function drawCurvedText(ctx, str, centerX, centerY, radius, angleStart, angleEnd, inward = false) {
      const chars = str.split('');
      const totalAngle = angleEnd - angleStart;
      const step = totalAngle / (chars.length - 1);

      chars.forEach((char, i) => {
        const angle = angleStart + i * step;
        ctx.save();
        ctx.translate(centerX, centerY);
        if (!inward) {
          // Pointing outwards (for top arc: top of letters facing away from center)
          ctx.rotate(angle + Math.PI / 2);
          ctx.translate(0, -radius);
        } else {
          // Inward (for bottom arc: top of letters facing center so they read upright left to right)
          ctx.rotate(angle - Math.PI / 2);
          ctx.translate(0, radius);
        }
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.fillText(char, 1, 2);
        ctx.fillStyle = '#332405';
        ctx.fillText(char, 0, 0);
        ctx.restore();
      });
    }

    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 1024;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#FAF7EE';
    ctx.beginPath();
    ctx.arc(512, 512, 500, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = '900 42px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Top arc: left to right (from -140 deg to -40 deg)
    drawCurvedText(ctx, '★ THE RADIANT HOTEL & RESORT ★', 512, 512, 390, -Math.PI * 0.78, -Math.PI * 0.22, false);

    // Bottom arc: left to right (from 140 deg down to 40 deg)
    // Note: To go left to right along bottom, angle goes from Math.PI * 0.75 down to Math.PI * 0.25!
    drawCurvedText(ctx, '★ GORAKHPUR LANDMARK ★', 512, 512, 390, Math.PI * 0.75, Math.PI * 0.25, true);

    const img = new Image();
    img.src = '/logo/logo.webp';
    img.onload = () => {
      ctx.drawImage(img, 512 - 240, 512 - 200, 480, 400);

      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
      camera.position.z = 4.4;

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(340, 340);
      container.appendChild(renderer.domElement);

      const tex = new THREE.CanvasTexture(canvas);
      const capGeo = new THREE.CircleGeometry(1.44, 80);
      const capMat = new THREE.MeshBasicMaterial({ map: tex });
      const cap = new THREE.Mesh(capGeo, capMat);
      scene.add(cap);

      renderer.render(scene, camera);
    };
  </script>
</body>
</html>
